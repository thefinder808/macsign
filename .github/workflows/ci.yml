name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Build, run the macOS test suite, and SIGN a fixture PE — all on macOS.
  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install SoftHSM + OpenSC (for the PKCS#11 lane)
        run: brew install softhsm opensc

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Sign fixtures (on macOS — proves the cross-platform claim)
        env:
          PFX_PW: macsign-ci-throwaway
        run: |
          FIXTURE=src/MacSign.Fixture/bin/Release/net10.0/MacSign.Fixture.dll
          cp "$FIXTURE" "$RUNNER_TEMP/signed.dll"
          cp "$FIXTURE" "$RUNNER_TEMP/signed-ts.dll"
          printf "Write-Host 'signed by MacSign'\n" > "$RUNNER_TEMP/install.ps1"
          dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            gen-test-cert --pfx "$RUNNER_TEMP/test.pfx" --cer "$RUNNER_TEMP/test.cer" --password-env PFX_PW
          dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            sign --pfx "$RUNNER_TEMP/test.pfx" --password-env PFX_PW --description "MacSign CI" "$RUNNER_TEMP/signed.dll"
          dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            sign --pfx "$RUNNER_TEMP/test.pfx" --password-env PFX_PW --description "MacSign CI (timestamped)" \
            --timestamp-url http://timestamp.digicert.com "$RUNNER_TEMP/signed-ts.dll"
          dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            sign --pfx "$RUNNER_TEMP/test.pfx" --password-env PFX_PW --description "MacSign CI (ps1)" "$RUNNER_TEMP/install.ps1"

          # PKCS#11 lane: put the same key+cert on a SoftHSM token, then sign with it.
          MODULE="$(brew --prefix softhsm)/lib/softhsm/libsofthsm2.so"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf"
          mkdir -p "$RUNNER_TEMP/tokens"
          printf 'directories.tokendir = %s/tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$RUNNER_TEMP" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label macsign --pin 1234 --so-pin 5678
          openssl pkcs12 -in "$RUNNER_TEMP/test.pfx" -nocerts -nodes -passin pass:"$PFX_PW" | openssl pkcs8 -topk8 -nocrypt -out "$RUNNER_TEMP/key.p8"
          softhsm2-util --import "$RUNNER_TEMP/key.p8" --token macsign --label codesign --id a1b2 --pin 1234
          pkcs11-tool --module "$MODULE" --login --pin 1234 --write-object "$RUNNER_TEMP/test.cer" --type cert --id a1b2 --label codesign
          cp "$FIXTURE" "$RUNNER_TEMP/signed-hsm.dll"
          PIN=1234 dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            sign --pkcs11-module "$MODULE" --password-env PIN --description "MacSign CI (HSM)" "$RUNNER_TEMP/signed-hsm.dll"

          # MSI lane: sign a committed test MSI fixture (OpenMcdf-backed).
          cp tests/MacSign.Signing.Tests/fixtures/test.msi "$RUNNER_TEMP/signed.msi"
          dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            sign --pfx "$RUNNER_TEMP/test.pfx" --password-env PFX_PW --description "MacSign CI (msi)" "$RUNNER_TEMP/signed.msi"

      - name: Cross-check with MacSign's own verify (macOS)
        run: |
          for f in signed.dll signed-ts.dll signed-hsm.dll install.ps1 signed.msi; do
            echo "--- verify $f ---"
            dotnet run --project src/MacSign.Cli -c Release --no-build -- verify "$RUNNER_TEMP/$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: |
            ${{ runner.temp }}/signed.dll
            ${{ runner.temp }}/signed-ts.dll
            ${{ runner.temp }}/signed-hsm.dll
            ${{ runner.temp }}/install.ps1
            ${{ runner.temp }}/signed.msi
            ${{ runner.temp }}/test.cer

  # THE bar: a real Windows authority must accept the macOS-produced signature.
  windows-verify:
    runs-on: windows-latest
    needs: build-test-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed

      - name: Trust the throwaway test certificate (deterministic chain trust)
        shell: pwsh
        run: certutil -addstore -f Root signed\test.cer

      - name: signtool verify /pa
        shell: pwsh
        run: |
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
          if (-not $st) { throw "signtool.exe not found on the runner." }
          Write-Host "Using $st"

          # Phase 1 gate: the plain signature must verify.
          & $st verify /pa /v signed\signed.dll
          if ($LASTEXITCODE -ne 0) { throw "signtool REJECTED the macOS-produced PE (exit $LASTEXITCODE)." }
          Write-Host "signtool ACCEPTED the plain signature."

          # Phase 2 gate: the timestamped signature must verify AND report a timestamp.
          $out = & $st verify /pa /v signed\signed-ts.dll 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "signtool REJECTED the timestamped PE (exit $LASTEXITCODE)." }
          if ($out -notmatch '(?i)timestamp') { throw "signtool reported no timestamp on signed-ts.dll." }
          Write-Host "signtool ACCEPTED the timestamped signature."

          # Phase 4 gate: the HSM (PKCS#11) signature — key never left the token.
          & $st verify /pa /v signed\signed-hsm.dll
          if ($LASTEXITCODE -ne 0) { throw "signtool REJECTED the HSM-signed PE (exit $LASTEXITCODE)." }
          Write-Host "signtool ACCEPTED the PKCS#11/HSM signature."

          # Phase 6 gate: the MSI signature.
          & $st verify /pa /v signed\signed.msi
          if ($LASTEXITCODE -ne 0) { throw "signtool REJECTED the signed MSI (exit $LASTEXITCODE)." }
          Write-Host "signtool ACCEPTED the MSI signature."

      - name: Verify the PowerShell signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed\install.ps1
          Write-Host "Status: $($sig.Status); Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Get-AuthenticodeSignature rejected install.ps1: $($sig.Status)" }
          Write-Host "PowerShell ACCEPTED the script signature."

  # Phase 3 (Azure Trusted Signing) — LIVE lane, gated on secrets. It no-ops until the
  # repo has the Azure Trusted Signing creds; the offline contract test in the suite
  # above already proves the delegated path is byte-identical to the signtool-proven
  # in-proc path. Provide these secrets to enable the real end-to-end signtool proof:
  #   AZURE_TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE  +  a service principal
  #   (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET, used by DefaultAzureCredential).
  azure-sign-macos:
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.gate.outputs.signed }}
    env:
      TS_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      TS_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      TS_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - id: gate
        run: |
          if [ -n "$TS_ACCOUNT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Azure Trusted Signing secrets not configured — skipping the live lane (the offline contract test still ran)."
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.signed == 'true' }}
      - uses: actions/setup-dotnet@v4
        if: ${{ steps.gate.outputs.signed == 'true' }}
        with:
          dotnet-version: "10.0.x"

      - name: Build
        if: ${{ steps.gate.outputs.signed == 'true' }}
        run: dotnet build -c Release

      - name: Sign a fixture PE via Azure Trusted Signing (key never leaves Azure)
        if: ${{ steps.gate.outputs.signed == 'true' }}
        run: |
          FIXTURE=src/MacSign.Fixture/bin/Release/net10.0/MacSign.Fixture.dll
          cp "$FIXTURE" "$RUNNER_TEMP/signed-azure.dll"
          dotnet run --project src/MacSign.Cli -c Release --no-build -- \
            sign --trusted-signing-endpoint "$TS_ENDPOINT" \
                 --trusted-signing-account "$TS_ACCOUNT" \
                 --trusted-signing-profile "$TS_PROFILE" \
                 --description "MacSign CI (Azure)" "$RUNNER_TEMP/signed-azure.dll"
          dotnet run --project src/MacSign.Cli -c Release --no-build -- verify "$RUNNER_TEMP/signed-azure.dll"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.gate.outputs.signed == 'true' }}
        with:
          name: signed-azure
          path: ${{ runner.temp }}/signed-azure.dll

  # A real Windows authority must accept the Azure-signed PE. Runs only when the live
  # lane above actually signed (Trusted Signing certs are publicly trusted, so no root
  # install is needed — this is the full end-to-end proof).
  azure-windows-verify:
    runs-on: windows-latest
    needs: azure-sign-macos
    if: ${{ needs.azure-sign-macos.outputs.signed == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-azure
          path: signed-azure

      - name: signtool verify /pa
        shell: pwsh
        run: |
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
          if (-not $st) { throw "signtool.exe not found on the runner." }
          & $st verify /pa /v signed-azure\signed-azure.dll
          if ($LASTEXITCODE -ne 0) { throw "signtool REJECTED the Azure Trusted Signing PE (exit $LASTEXITCODE)." }
          Write-Host "signtool ACCEPTED the Azure Trusted Signing signature."
