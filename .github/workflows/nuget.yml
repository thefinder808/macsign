name: NuGet

# Publishes the four engine packages (MacSign.Signing + .Msi/.Pkcs11/.Azure) to
# nuget.org on every release tag. Requires a NUGET_API_KEY secret in the "release"
# environment; until it's added, the job still packs but skips the push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening for a public repo).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Pack engine packages
        run: |
          for proj in MacSign.Signing MacSign.Signing.Msi MacSign.Signing.Pkcs11 MacSign.Signing.Azure; do
            dotnet pack "src/$proj/$proj.csproj" -c Release -o dist/nuget
          done
          ls -l dist/nuget

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set — packages were packed but NOT published."
            exit 0
          fi
          dotnet nuget push "dist/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
