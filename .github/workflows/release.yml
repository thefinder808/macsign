name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # create/upload GitHub Releases

# Required secrets (env-scoped under the "release" environment) to produce a
# SIGNED + NOTARIZED DMG. Until they're added, the build degrades to UNSIGNED:
#   APPLE_SIGN_IDENTITY     "Developer ID Application: NAME (TEAMID)"
#   APPLE_CERT_P12_BASE64   base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD     password for that .p12
#   APPLE_API_KEY_P8_BASE64 base64 of the App Store Connect notary .p8 key
#   APPLE_API_KEY_ID        notary key id
#   APPLE_API_ISSUER        notary issuer id

jobs:
  macos:
    runs-on: macos-latest
    environment: release
    env:
      # Empty until the secrets are added → the build degrades to UNSIGNED.
      SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      # Actions pinned to commit SHAs (supply-chain hardening for a public repo).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Install SoftHSM + OpenSC (for the PKCS#11 test lane)
        run: brew install softhsm opensc

      - name: Test
        run: dotnet test --configuration Release

      # GITHUB_REF_NAME is the built-in tag name (e.g. "v1.2.3"); strip the "v".
      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A tag-driven official release must be signed + notarized. If any signing/notary
      # secret is missing (renamed, unset, or not scoped to the `release` environment),
      # fail HERE rather than silently publishing an unsigned DMG. Unsigned builds remain
      # an explicit LOCAL path (run build-macos.sh without these vars); they are never the
      # behavior of this job. Secrets arrive via env: (quoted vars), not interpolated run:.
      - name: Require release signing secrets
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          : "${SIGN_IDENTITY:?missing secret APPLE_SIGN_IDENTITY}"
          : "${NOTARY_KEY_ID:?missing secret APPLE_API_KEY_ID}"
          : "${NOTARY_ISSUER:?missing secret APPLE_API_ISSUER}"
          : "${CERT_P12_BASE64:?missing secret APPLE_CERT_P12_BASE64}"
          : "${CERT_PASSWORD:?missing secret APPLE_CERT_PASSWORD}"
          : "${API_KEY_P8_BASE64:?missing secret APPLE_API_KEY_P8_BASE64}"
          echo "All release signing secrets are present."

      - name: Import Developer ID certificate
        if: env.SIGN_IDENTITY != ''
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write notary API key
        if: env.SIGN_IDENTITY != ''
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize (arm64 + x64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          RID=osx-arm64 ./build-macos.sh
          RID=osx-x64   ./build-macos.sh

      # Gate the upload on proof each DMG is what we intend to ship: the inner app is
      # Developer-ID signed by our Team ID + Gatekeeper-accepted (notarized), and the .dmg
      # carries a stapled ticket. Mirrors the runtime updater trust gate so CI rejects
      # exactly what the in-app updater would. Any failure ⇒ the job fails and nothing
      # uploads. All paths come from our own build output (dist/*.dmg) — no external input.
      - name: Verify signed + notarized DMGs before upload
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "::error::no DMGs were produced"; exit 1; }
          for dmg in "${dmgs[@]}"; do
            echo "== verifying $dmg =="
            xcrun stapler validate "$dmg"
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            ok=1
            app="$(/usr/bin/find "$mnt" -maxdepth 1 -name '*.app' -print -quit || true)"
            if [ -z "$app" ]; then
              echo "::error::no .app inside $dmg"; ok=0
            else
              codesign --verify --deep --strict --verbose=2 "$app" || ok=0
              team="$(codesign -dvvv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p' || true)"
              [ "$team" = "Q6LRJQSA42" ] || { echo "::error::wrong Team ID '$team' in $dmg"; ok=0; }
              spctl --assess --type exec -vv "$app" || ok=0
            fi
            hdiutil detach "$mnt" >/dev/null 2>&1 || true
            rmdir "$mnt" 2>/dev/null || true
            [ "$ok" = 1 ] || { echo "::error::$dmg failed verification"; exit 1; }
          done
          echo "All release DMGs are Developer-ID signed (Q6LRJQSA42) + notarized."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.dmg --clobber
